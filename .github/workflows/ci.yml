# Every action is pinned to a full commit, the token can only read, and the
# checkout does not keep the credential in the workspace. Dependencies install
# only from hashed locks, and the one binary fetched at run time is verified
# against a hash recorded here.

name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: tests and coverage floors
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.13"   # what the collector runs
      - name: Install from the locks
        run: python -m pip install --require-hashes -r requirements.txt -r requirements-dev.txt
      - name: Test suite
        run: python -m pytest -q --cov --cov-report=json:coverage.json --cov-report=term
      - name: Per-module coverage floors
        run: python tools/check_coverage.py coverage.json

  cowrie-parity:
    name: userdb rules against Cowrie's own parser
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"   # what the sensor runs
      - name: Install the Cowrie version the sensor runs
        run: python -m pip install --require-hashes -r requirements-cowrie.txt
      - name: Cross-check, which must run rather than skip
        run: |
          python -m unittest tests.test_userdb -v 2>&1 | tee parity.log
          # Match unittest's skip markers, not the word: one test is named
          # test_short_line_is_skipped_not_fatal.
          if grep -Eq '\.\.\. skipped|^OK \(skipped' parity.log; then
            echo "the Cowrie cross-check skipped, so nothing was compared"; exit 1
          fi

  lint:
    name: static analysis and shell tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.13"
      - name: Install from the locks
        run: python -m pip install --require-hashes -r requirements.txt -r requirements-dev.txt
      - name: ruff
        run: ruff check .
      - name: bandit
        run: bandit -q -c pyproject.toml -r . -ll
      - name: vulture
        run: vulture
      - name: shellcheck
        run: shellcheck pull.sh bin/*.sh deploy/*.sh sensor/bin/*.sh
      - name: bats
        run: |
          sudo apt-get install -y -q bats
          bats tests/shell

  supply-chain:
    name: dependency audit and secret scan
    runs-on: ubuntu-24.04
    env:
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0   # the whole history, not only the latest commit
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.13"
      - name: Install from the locks
        run: python -m pip install --require-hashes -r requirements.txt -r requirements-dev.txt
      - name: Known vulnerabilities in the locks
        run: |
          pip-audit --require-hashes --disable-pip -r requirements.txt
          pip-audit --require-hashes --disable-pip -r requirements-dev.txt
          pip-audit --require-hashes --disable-pip -r requirements-cowrie.txt
      - name: Secrets anywhere in history
        run: |
          curl -fsSL -o gitleaks.tgz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum --check --strict
          tar xzf gitleaks.tgz gitleaks
          ./gitleaks git --no-banner --redact --exit-code 1 .
