# The persona filesystem can fail in two directions and neither announces
# itself. A path present in honeyfs but missing from fs.pickle is unreachable,
# which is how the AWS canarytoken sat unread for weeks while looking planted.
# A null symlink target or a duplicate directory entry kills every session at
# "Error getting shell", which looks like an attacker problem rather than ours.
#
# Both are cheap to detect and expensive to notice in production, so check on
# every start. Unlike the userdb gate this is a warning, not a hard stop: a
# stale persona still runs a working honeypot, and refusing to start would
# trade a fidelity problem for an outage. Watch the unit log after a deploy.
[Service]
ExecStartPre=-/usr/bin/python3 /opt/cowrie/bin/persona_fs.py check
