# Refresh the host facts the persona serves (kernel, CPU, mounts, command
# output) on every start, so a reboot into a new kernel is picked up. The +
# runs this one step as root outside the unit's sandbox, because it writes to
# honeyfs and txtcmds, which the cowrie account cannot.
[Service]
ExecStartPre=+/opt/cowrie/bin/mirror-host.sh static
