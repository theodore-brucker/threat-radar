# /opt/cowrie/cowrie.cfg - EXAMPLE persona overlay
# Read AFTER etc/cowrie.cfg by cowrie.core.config.get_config_path(), so every
# key here wins. Delete the file to revert the entire persona.
#
# Placeholder identity values. Set hostname, kernel and version strings to a
# consistent story for your own sensor.

[honeypot]
hostname = node-01
sensor_name = sensor-01
auth_class = UserDB
# txtcmds_path is resolved relative to WorkingDirectory (/opt/cowrie), so the
# shipped default of "txtcmds" misses the tree under share/cowrie.
txtcmds_path = /opt/cowrie/share/cowrie/txtcmds
contents_path = /opt/cowrie/honeyfs
idle_timeout = 420
authentication_timeout = 120

[shell]
filesystem = /opt/cowrie/var/lib/cowrie/fs.pickle
arch = linux-x64-lsb
kernel_version = 6.8.0-45-generic
kernel_build_string = #45-Ubuntu SMP PREEMPT_DYNAMIC Fri Aug 30 12:02:04 UTC 2024
hardware_platform = x86_64
operating_system = GNU/Linux
# must agree with [ssh] version
ssh_version = OpenSSH_9.6p1 Ubuntu-3ubuntu13.5, OpenSSL 3.0.13 30 Jan 2024

[ssh]
version = SSH-2.0-OpenSSH_9.6p1 Ubuntu-3ubuntu13.5
# Only algorithms twisted.conch actually implements. Advertising anything else
# (chacha20, aes-gcm, ETM macs, zlib@openssh.com, cast128-cbc) makes clients
# select it and the session dies at key exchange.
ciphers = aes256-ctr,aes192-ctr,aes128-ctr
macs = hmac-sha2-512,hmac-sha2-256
compression = none
kex = ecdh-sha2-nistp521,ecdh-sha2-nistp384,ecdh-sha2-nistp256,diffie-hellman-group-exchange-sha256
sftp_enabled = true
forwarding = true
forward_redirect = false
forward_tunnel = false
auth_none_enabled = false
auth_publickey_allow_any = false

[telnet]
enabled = false
