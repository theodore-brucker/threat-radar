<link rel="icon" href="__TR_BASE__/static/favicon.svg" type="image/svg+xml">
<link rel="icon" href="__TR_BASE__/static/favicon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="__TR_BASE__/static/apple-touch-icon.png">
<link rel="preload" href="__TR_BASE__/static/fonts/IBMPlexSans-Latin-Var.woff2" as="font" type="font/woff2" crossorigin>

<script>
  /* Theme is resolved before first paint so a dark-mode reader never gets a
     white flash. Kept tiny; everything else is a module. */
  (function () {
    try {
      var p = localStorage.getItem("tr.theme") || "auto";
      var dark = p === "dark" || (p === "auto" &&
        window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
      document.documentElement.dataset.theme = dark ? "dark" : "light";
    } catch (e) { /* storage blocked: light is the correct default */ }
  })();
</script>
</head>
<body data-mode="exec" data-density="compact">
<a class="skiplink" href="#view">Skip to content</a>
<div class="stalebar" id="stalebar" role="status" hidden></div>
<div class="shell">
  <nav class="nav" aria-label="Sections">
    <a class="brand" id="brand" href="__TR_BASE__/">
      <img src="__TR_BASE__/static/favicon.svg" alt="" width="24" height="24">
      <b>Threat Radar</b>
    </a>
    <ul>
      <li><a href="#" data-path="/">Overview <kbd>1</kbd></a></li>
      <li><a href="#" data-path="/sources">Sources <kbd>2</kbd></a></li>
      <li><a href="#" data-path="/credentials">Credentials <kbd>3</kbd></a></li>
      <li><a href="#" data-path="/payloads">Malware <kbd>4</kbd></a></li>
      <li><a href="#" data-path="/sessions">Sessions <kbd>5</kbd></a></li>

    </ul>
    <div class="foot">
      <div class="status"><span class="dot unknown" id="health-dot"></span> <span id="health-text">Checking the sensor</span></div>
      <div id="coverage"></div>
      <div>A personal project by <a href="https://theobrucker.us">Theo Brucker</a>. Views are my own.</div>
      <button type="button" class="quiet" id="keys-open">Keyboard shortcuts <kbd>?</kbd></button>
    </div>
  </nav>

  <div class="main">
    <header class="topbar" data-print-scope="">
      <h1 id="page-title">Overview</h1>
      <div class="omni" role="search">
        <span class="omni-icon" id="omni-icon" aria-hidden="true"></span>
        <input id="omnibar" type="search" autocomplete="off" spellcheck="false"
               aria-label="Search for an address, hash, credential, network or date"
               aria-controls="omnibar-results" aria-expanded="false"
               placeholder="Search an address, hash, user:pass, AS number or date">
        <kbd class="omni-key" aria-hidden="true">/</kbd>
        <ul id="omnibar-results" class="omni-drop" role="listbox" aria-label="Search results" hidden></ul>
      </div>
      <div class="spacer"></div>
      <div class="seg-ctl modeswitch" role="group" aria-label="Detail level">
        <button type="button" data-mode="exec" aria-pressed="true">Summary</button>
        <button type="button" data-mode="analyst" aria-pressed="false">Analyst</button>
      </div>
      <div class="sep" aria-hidden="true"></div>
      <label class="ctl-label" for="window-select">Window</label>
      <select id="window-select">
        <option value="1">Last 24 hours</option>
        <option value="7">Last 7 days</option>
        <option value="14">Last 14 days</option>
        <option value="30">Last 30 days</option>
        <option value="90">Last 90 days</option>
        <option value="3650">All time</option>
      </select>
      <button type="button" id="density-toggle" class="quiet iconbtn" aria-label="Row density: compact"></button>
      <button type="button" id="theme-toggle" class="quiet iconbtn" aria-label="Colour theme: follow the system"></button>
    </header>
    <main class="content" id="view" tabindex="-1" aria-busy="false"></main>
  </div>
</div>
