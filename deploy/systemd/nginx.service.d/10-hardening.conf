# /etc/systemd/system/nginx.service.d/10-hardening.conf
#
# nginx is the only process on the Pi still running unconfined, and it is the
# one listening on the network. The master runs as root and keeps the few
# capabilities it needs to do its job: binding port 80, dropping workers to
# www-data, signalling those workers on reload, and owning its log files.
# Everything else is dropped. If a reload or a restart fails with a permission
# error after this, CAP_DAC_OVERRIDE is the capability to add back first, and
# the journal will name the file it could not open.
[Service]
ReadWritePaths=/var/log/nginx /var/lib/nginx /run -/var/cache/nginx
NoNewPrivileges=true
PrivateTmp=true
PrivateDevices=true
ProtectSystem=strict
ProtectHome=true
ProtectProc=invisible
ProtectClock=true
ProtectHostname=true
ProtectKernelLogs=true
ProtectKernelModules=true
ProtectKernelTunables=true
ProtectControlGroups=true
RestrictNamespaces=true
RestrictRealtime=true
RestrictSUIDSGID=true
LockPersonality=true
CapabilityBoundingSet=CAP_NET_BIND_SERVICE CAP_SETUID CAP_SETGID CAP_KILL CAP_CHOWN
AmbientCapabilities=CAP_NET_BIND_SERVICE
SystemCallArchitectures=native
SystemCallFilter=@system-service
SystemCallErrorNumber=EPERM
RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6
