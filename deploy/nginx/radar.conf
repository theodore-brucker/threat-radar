# Threat Radar dashboard. Install to /etc/nginx/sites-available/radar and
# symlink it into sites-enabled.
#
# The application sets its own security headers on every response, including
# static files: a content security policy with hashed inline script, nosniff,
# framing, referrer and permissions policy. nginx adds none of its own here.
# Two policies on one response are both enforced by the browser, and the
# older of the two allowed inline script and two CDNs the site stopped using.

limit_req_zone $binary_remote_addr zone=radar_general:10m rate=30r/s;

server {
    listen 80 default_server;
    server_name radar.local raspberrypi.local _;

    access_log /var/log/nginx/radar-access.log;
    error_log  /var/log/nginx/radar-error.log warn;

    # Deployment-specific denials live outside the repo. The honeypot sensor
    # is the case that matters: its tailnet address falls inside the range
    # allowed below, and a compromised Cowrie process can make outbound HTTP
    # requests, so it is denied by address. Create
    # /etc/nginx/radar-local-deny.conf with one "deny <address>;" per line.
    # Rules are evaluated in order and the first match wins, so this include
    # has to come before the allow list.
    include /etc/nginx/radar-local-deny.conf*;

    allow 127.0.0.1;
    allow 10.0.0.0/8;
    allow 172.16.0.0/12;
    allow 192.168.0.0/16;
    allow 100.64.0.0/10;        # Tailscale CGNAT range
    # This server listens on IPv4 only, so the Tailscale IPv6 range is not
    # listed. If a listen [::]:80 is ever added, allow fd7a:115c:a1e0::/48
    # here and deny the sensor's IPv6 address in the local file above.
    deny  all;

    auth_basic           "Threat Radar";
    auth_basic_user_file /etc/nginx/.radar-htpasswd;

    client_max_body_size 16k;

    gzip on;
    gzip_proxied any;
    gzip_types application/json text/css application/javascript;
    gzip_min_length 512;

    # Editor leftovers and archived pages are served by the static mount if
    # they exist on disk. Nothing with these names is ever a real asset, and
    # this runs before authentication, so it holds even for a stray request.
    location ~ (^|/)\.|\.bak|_archive {
        return 404;
    }

    location / {
        limit_req zone=radar_general burst=60 nodelay;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
