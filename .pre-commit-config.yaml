# Optional. The same checks CI runs, before a commit instead of after a push:
#   pip install pre-commit && pre-commit install
# Hooks are pinned to commits rather than tags, like the CI actions.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: 2eeb5678de71a00c0902cbda7105d328432f72cb  # v0.16.8
    hooks:
      - id: ruff
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: 745eface02aef23e168a8afb6b5737818efbea95  # v0.11.0.1
    hooks:
      - id: shellcheck
  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e  # v8.30.1
    hooks:
      - id: gitleaks
  - repo: local
    hooks:
      - id: sql-construction
        name: every SQL interpolation is reviewed
        entry: python -m pytest -q tests/test_sql_construction.py
        language: system
        pass_filenames: false
        files: \.py$
